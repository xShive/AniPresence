<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AniPresence</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,add,arrow_back,dark_mode,light_mode,remove,settings,star,swap_horiz,unfold_more,visibility_off" />
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1>AniPresence</h1>
            <span class="version">vX.X.X</span> 
        </div>

        <div class="icons">
            <button class="icon-btn theme-btn material-symbols-outlined">dark_mode</button>
            <button class="icon-btn material-symbols-outlined">account_circle</button>
            <button class="icon-btn material-symbols-outlined">settings</button>
        </div>
    </header>

    <main class="views">

        <!-- strip + panel -->
        <section class="view view-main">
            <section class="discord-strip">
                <img class="strip-cover" src="" alt="cover">

                <div class="strip-info">
                    <h2 class="strip-title"></h2>
                    <p class="strip-subtitle"></p>

                    <div class="strip-meta">
                        <span class="strip-pill pill-progress"></span>
                        <span class="strip-pill">
                            <span class="material-symbols-outlined"></span>
                            <span class="pill-score"></span>
                        </span>
                        <span class="strip-pill pill-type"></span>
                    </div>
                </div>

                <span class="strip-status"></span>
            </section>

            <section class="panel">
                <div class="controls">
                    <div class="status-wrap">
                        <button class="status-select">
                            <span class="status-text"></span>
                            <span class="material-symbols-outlined">unfold_more</span>
                        </button>

                        <ul class="status-menu">
                            <li>Watching</li>
                            <li>Completed</li>
                            <li>On hold</li>
                            <li>Dropped</li>
                            <li>Plan to watch</li>
                        </ul>
                    </div>

                    <button class="mode-switch">
                        <span class="material-symbols-outlined">swap_horiz</span>
                        <span class="mode-text">Anime</span>
                    </button>
                </div>

                <div class="grid"></div>
            </section>
        </section>
    </main>

    <!-- detail modal -->
    <div class="modal-overlay hidden">
        <div class="modal-card">
            <button class="back-btn material-symbols-outlined">arrow_back</button>

            <div class="detail-hero">
                <img class="detail-cover" src="" alt="cover">
                <div class="detail-titles">
                    <h2 class="detail-title"></h2>
                    <p class="detail-romaji"></p>
                    <p class="detail-kanji"></p>

                    <div class="detail-pills">
                        <span class="detail-pill detail-type"></span>
                        <span class="detail-pill">
                            <span class="material-symbols-outlined">star</span>
                            <span class="detail-mean"></span>
                        </span>
                        <span class="detail-pill detail-rank"></span>
                    </div>
                </div>
            </div>

            <div class="detail-meta-row">
                <div class="ep-stepper">
                    <button class="ep-btn ep-minus material-symbols-outlined">remove</button>
                    <span class="detail-progress"></span>
                    <button class="ep-btn ep-plus material-symbols-outlined">add</button>
                </div>
                <span class="detail-status"></span>
            </div>

            <p class="detail-synopsis"></p>
            <button class="synopsis-toggle"></button>

            <a class="detail-mal" target="_blank" rel="noopener">View on MAL</a>
        </div>
    </div>

    <div class="footer">
        <a class="github" href="https://github.com/xShive/AniPresence">
            <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
        
        <div class="ghost-toggle">
            <span class="ghost-label">Ghost</span>
            <span class="ghost-knob">
                <span class="material-symbols-outlined">visibility_off</span>
            </span>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
